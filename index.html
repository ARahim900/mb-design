<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to anything other than
         0px; without it the modal close button hides under the status bar and the order bar
         sits under the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1417" />
    <meta name="application-name" content="MB Design" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MB Design" />
    <meta name="msapplication-TileColor" content="#1C1417" />
    <meta
      name="description"
      content="MB Design — a contemporary Omani abaya label. Bilingual launch storefront preview."
    />
    <link rel="icon" href="/brand/mb-design-symbol.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/mb-design-favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/mb-design-apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/brand/mb-design-logo-monochrome.svg" color="#B8744D" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/assets/collection-v2/hero-plum.webp" as="image" type="image/webp" />
    <title>MB Design</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
